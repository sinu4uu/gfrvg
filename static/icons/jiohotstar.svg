<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 44" width="135" height="38" fill="none">
  <defs>
    <linearGradient id="hotstarStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8800"/>
    </linearGradient>
    <linearGradient id="disneyArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g transform="translate(3, 4)" filter="url(#subtleShadow)">
    <!-- Hotstar Multi-point Star Icon -->
    <g transform="translate(0, 2)">
      <path d="M16 2l3.4 7.2 7.8 1.1-5.7 5.5 1.4 7.8-6.9-3.7-6.9 3.7 1.4-7.8-5.7-5.5 7.8-1.1L16 2z" fill="url(#hotstarStarGrad)"/>
      <path d="M16 7.5l1.9 4 4.3.6-3.2 3.1.8 4.3-3.8-2-3.8 2 .8-4.3-3.2-3.1 4.3-.6L16 7.5z" fill="#FFFFFF" opacity="0.45"/>
    </g>

    <!-- Disney Sweeping Curve Arc -->
    <path d="M4 25C10 11 20 5 32 4" stroke="url(#disneyArcGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Disney+ hotstar Brand Typography -->
    <!-- Disney+ Script-style header text -->
    <text x="36" y="15" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="-0.4" fill="#00147a">Disney+</text>
    
    <!-- hotstar Bold Modern Sans -->
    <text x="36" y="32" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="16.5" font-weight="900" letter-spacing="-0.6" fill="#051442">hotstar</text>
  </g>
</svg>
